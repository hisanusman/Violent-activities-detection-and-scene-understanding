<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchDog AI - Video Navigator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .header, .footer {
            background-color: #1e293b;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header {
            height: 60px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: absolute;
            top: 0;
        }

        .footer {
            height: 40px;
            position: absolute;
            bottom: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .logo-icon {
            color: #3b82f6;
            margin-right: 10px;
            font-size: 1.6rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .time, .date {
            color: #e5e7eb;
            font-size: 0.9rem;
        }

        /* Fixed Video Box */
        .video-container {
            width: 900px; /* Fixed width */
            height: 500px; /* Fixed height */
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures full visibility of the video */
            border-radius: 5px;
            background-color: #16202f;
        }

        .video-info {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 10;
        }

        .record-icon {
            color: #ef4444;
            margin-right: 8px;
        }

        /* Navigation Buttons */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .button-container button, .button-container a {
            text-decoration: none;
            padding: 12px 18px;
            background-color: #1e293b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .button-container button:hover, .button-container a:hover {
            background-color: #2d3748;
        }

        .nav-icon {
            margin-right: 8px;
            font-size: 1.2rem;
        }

        .navigation-info {
            text-align: center;
            margin-top: 15px;
            background-color: #1e293b;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #e5e7eb;
        }

        .timestamp {
            font-weight: bold;
            color: #3b82f6;
        }

        .counter {
            margin-left: 10px;
            color: #9ca3af;
        }
    </style>
    <script>
        let times = {{ times|tojson }};
        let currentIndex = 0;
        let video;

        function navigate(direction) {
            if (times.length === 0) return;
            if (direction === 'prev' && currentIndex > 0) {
                currentIndex--;
            } else if (direction === 'next' && currentIndex < times.length - 1) {
                currentIndex++;
            } else {
                return;
            }
            const timeStr = times[currentIndex].split(':');
            if (timeStr.length !== 3) return;
            const timeInSeconds = parseInt(timeStr[0]) * 3600 + parseInt(timeStr[1]) * 60 + parseInt(timeStr[2]);
            if (video.readyState >= 2) {
                video.currentTime = timeInSeconds;
                video.pause();
                updateTimestampInfo();
            }
        }

        function updateTimestampInfo() {
            document.getElementById('timestamp').textContent = times[currentIndex];
            document.getElementById('counter').textContent = `${currentIndex + 1} of ${times.length}`;
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: true });
            document.getElementById('current-date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            video = document.getElementById('video');
            updateDateTime();
            setInterval(updateDateTime, 1000);
        });
    </script>
</head>
<body>
    <div class="header">
        <div class="logo">
            <span class="logo-icon">&#128249;</span>
            <span>WatchDog AI</span>
        </div>
        <div class="header-right">
            <div class="time">
                <span id="current-time"></span>
            </div>
            <div class="date">
                <span id="current-date"></span>
            </div>
        </div>
    </div>

    <h1 style="margin-top: 70px;">Video Navigator</h1>

    <div class="video-container">
        <video id="video" controls>
            <source src="{{ url_for('static', filename='processed/' + video) }}" type="video/webm">
        </video>
        <div class="video-info">
            <span class="record-icon">&#9679;</span>
            <span>Recording Playback</span>
        </div>
    </div>

    <div class="navigation-info">
        Current Timestamp: <span id="timestamp" class="timestamp">00:00:00</span>
        <span id="counter" class="counter">0 of 0</span>
    </div>

    <div class="button-container">
        <button onclick="navigate('prev')">Previous Timestamp</button>
        <button onclick="navigate('next')">Next Timestamp</button>
    </div>

    <div class="button-container">
        <a href="{{ url_for('index') }}">Back to Grid</a>
    </div>

    <div class="footer">
        <div class="system-status">
            <span class="status-dot"></span>
            <span>System Status: Normal</span>
        </div>
    </div>
</body>
</html>
