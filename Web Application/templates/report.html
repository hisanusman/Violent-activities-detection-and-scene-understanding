{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Report for {{ video }}</h2>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Detected Activity: {{ activity }}</h5>
            <div class="mt-3">
                <h6>Scene Description:</h6>
                <p class="card-text" style="white-space: pre-line">{{ scene_description }}</p>
            </div>
            {% if pdf_path %}
            <div class="mt-3">
                <a href="{{ url_for('static', filename=pdf_path) }}" class="btn btn-primary" target="_blank">View PDF Report</a>
            </div>
            {% endif %}
            <div class="mt-3">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Videos</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
