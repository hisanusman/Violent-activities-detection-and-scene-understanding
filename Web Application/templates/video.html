<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <style>
      .stream-container {
          width: 100%;
          height: 600px;
          background: black;
          display: flex;
          justify-content: center;
          align-items: center;
      }
      .stream-container img {
          width: 100%;
          height: 100%;
          object-fit: contain;
      }
      .button-container {
          margin-top: 20px;
      }
      .button-container a {
          text-decoration: none;
          padding: 10px 20px;
          margin-right: 10px;
          background-color: #007BFF;
          color: white;
          border-radius: 5px;
      }
      .button-container a:hover {
          background-color: #0056b3;
      }
  </style>
</head>
<body>
  <h1>Video Player (Real-Time Processed)</h1>
  <div class="stream-container">
      <!-- The MJPEG stream is served by /stream_video/<video_id> -->
      <img src="{{ url_for('stream_video', video_id=video_id) }}" alt="Processed Video Stream">
  </div>
  <div class="button-container">
      <a href="{{ url_for('index') }}">Back to Grid</a>
      <a href="{{ url_for('navigation', video_id=video_id) }}">Navigator</a>
      <a href="{{ url_for('report', video_id=video_id) }}">Create Report</a>
  </div>
</body>
</html>
