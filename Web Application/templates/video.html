<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Video Stream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background-color: #1e293b;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 60px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      position: fixed;
      top: 0;
      z-index: 100;
    }

    .main-content {
      margin-top: 60px;
      margin-bottom: 60px;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .footer {
      background-color: #1e293b;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 40px;
      position: fixed;
      bottom: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      font-weight: bold;
      font-size: 1.5rem;
    }

    .logo-icon {
      color: #3b82f6;
      margin-right: 10px;
      font-size: 1.6rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .time, .date {
      color: #e5e7eb;
      font-size: 0.9rem;
    }

    /* Stream Container */
    .stream-container {
      width: 100%;
      max-width: 900px;
      background: #1e293b;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
      aspect-ratio: 16/9;
    }

    .stream-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 5px;
    }

    /* Buttons */
    .button-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      padding: 10px;
      margin-bottom: 50px;
    }

    .button-container a {
      text-decoration: none;
      padding: 12px 20px;
      background-color: #3b82f6;
      color: white;
      border-radius: 5px;
      transition: 0.3s;
      white-space: nowrap;
    }

    .button-container a:hover {
      background-color: #2563eb;
    }

    .system-status {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      color: #e5e7eb;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      margin-right: 10px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .stream-container {
        width: 95%;
      }
      
      .button-container {
        padding: 10px 5px;
      }
      
      .button-container a {
        padding: 10px 15px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="logo-icon">&#128249;</span>
      <span>WatchDog AI</span>
    </div>
    <div class="header-right">
      <div class="time">
        <span id="current-time"></span>
      </div>
      <div class="date">
        <span id="current-date"></span>
      </div>
    </div>
  </div>

  <div class="main-content">
    <h1>Live Video Stream</h1>

    <div class="stream-container">
      <img src="{{ url_for('stream_video', video_id=video_id) }}" alt="Processed Video Stream">
    </div>

    <div class="button-container">
      <a href="{{ url_for('index') }}">Back to Grid</a>
      <a href="{{ url_for('navigation', video_id=video_id) }}">Navigator</a>
      <a href="{{ url_for('report', video_id=video_id) }}">Generate Report</a>
    </div>
  </div>

  <div class="footer">
    <div class="system-status">
      <span class="status-dot"></span>
      <span>System Status: Normal</span>
    </div>
  </div>

  <script>
    function updateDateTime() {
      const now = new Date();
      const timeOptions = { hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: true };
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      
      document.getElementById('current-time').textContent = now.toLocaleTimeString('en-US', timeOptions);
      document.getElementById('current-date').textContent = now.toLocaleDateString('en-US', dateOptions);
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>
</body>
</html>
